pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting zones (shared memory across worker processes)
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=hubs:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=token:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=account:10m rate=6r/m;

    # ============================
    # ✅ GZIP COMPRESSION
    # ============================
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_buffers 16 8k;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    gzip_disable "msie6";
    gzip_vary on;

    # ✅ DEFAULT RATE LIMITING STATUS (429 = Too Many Requests per RFC 6585)
    limit_req_status 429;

    # ✅ BFF upstream (ip_hash for SignalR stickiness across replicas)
    upstream bff_upstream {
        ip_hash;
        zone bff_upstream 64k;
        server promisemodelonline.bff:8010 resolve;
    }

    # ✅ DNS resolver for upstream resolve parameters
    resolver 127.0.0.11 valid=30s;

    # ✅ Load server config(s)
    include /etc/nginx/conf.d/*.conf;
}