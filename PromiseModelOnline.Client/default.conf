server {
    listen 9000 ssl;
    server_name localhost;


    # ✅ FIX LARGE HEADERS (OIDC COOKIES)
    proxy_buffer_size        128k;
    proxy_buffers            8 256k;
    proxy_busy_buffers_size  256k;

    # ✅ ALSO IMPORTANT
    large_client_header_buffers 4 256k;


    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    root /app/wwwroot;
    index index.html;

    # ============================
    # ✅ SPA ROUTING
    # ============================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # ============================
    # ✅ STATIC ASSETS (CACHE)
    # ============================    
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ============================
    # ✅ API → BFF
    # ============================
    location /api/ {
        proxy_pass https://promisemodelonline.bff:8010;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ SIGNALR
    # ============================
    location /hubs/ {
        proxy_pass https://promisemodelonline.bff:8010;

        # Standard WebSocket handshake negotiation protocol mapping
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Forward precise client environment details downstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial for persistent real-time streaming connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ HEALTH
    # ============================
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # ============================
    # ✅ SECURITY HEADERS
    # ============================
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'sha256-j7OoGArf6XW6YY4cAyS3riSSvrJRqpSi1fOF9vQ5SrI='; style-src 'self'; img-src 'self'; connect-src 'self' wss://localhost:9000 https://localhost:9000;";
    add_header Content-Language "en-CA";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";

    # ============================
    # ✅ BFF AUTH ROUTES
    # ============================
    location /login {
        proxy_pass https://promisemodelonline.bff:8010;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location /logout {
        proxy_pass https://promisemodelonline.bff:8010;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location /signin-oidc {
        proxy_pass https://promisemodelonline.bff:8010;

        proxy_http_version 1.1;

        # ✅ REQUIRED HEADERS
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ✅ CRITICAL FOR FORM POST
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;

        # ✅ VERY IMPORTANT
        proxy_request_buffering off;

        # ✅ prevent connection issues
        proxy_set_header Connection "";

        proxy_ssl_verify off;
    }

    location /signout-callback-oidc {
        proxy_pass https://promisemodelonline.bff:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    # ============================
    # ✅ AUTH SERVER (DIRECT)
    # ============================

    location /connect/ {
        proxy_pass https://promisemodelonline.auth:8060;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
    }

    location /account/ {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ AUTH STATIC ASSETS
    # ============================
    location ^~ /css/auth.css {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location ^~ /js/auth-page.js {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}
