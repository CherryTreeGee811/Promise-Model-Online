server {
    listen 9000 ssl;
    listen 8080;
    server_name localhost;


    # ✅ FIX LARGE HEADERS (OIDC COOKIES)
    proxy_buffer_size        128k;
    proxy_buffers            8 256k;
    proxy_busy_buffers_size  256k;

    # ✅ ALSO IMPORTANT
    large_client_header_buffers 4 256k;


    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    root /app/wwwroot;
    index index.html;

    # ============================
    # ✅ ROBOTS.TXT (dynamic host for Sitemap)
    # ============================
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 "User-agent: *
Disallow: /api/
Disallow: /hubs/
Disallow: /login
Disallow: /logout
Disallow: /register
Disallow: /account/
Disallow: /connect/
Disallow: /.well-known/
Disallow: /signin-oidc
Disallow: /signout-callback-oidc
Disallow: /signin-google
Disallow: /health
Disallow: /change-password

Sitemap: https://$host/sitemap.xml
";
    }

    # ============================
    # ✅ SITEMAP.XML (Google Search, dynamic host)
    # ============================
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://$host/</loc>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>';
    }

    # ============================
    # ✅ FAVICON
    # ============================
    location = /favicon.ico {
        return 301 /images/favicon.ico;
    }

    # ============================
    # ✅ SPA ROUTING
    # ============================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-01QCnpni8n/AK7RwVFswDqqWdAWCI20dHYx1Zqoi/gg=' 'sha256-Er80AO95jpSF3nGEdfbV1/qIJC1d82CCRs6/RbdKzDo='; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; style-src-attr 'sha256-aqNNdDLnnrDOnTNdkJpYlAxKVJtLt9CtFLklmInuUAE='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
        add_header Content-Language "en-CA";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ============================
    # ✅ STATIC ASSETS (CACHE)
    # ============================    
    location ~* \.(?:mjs|js)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ============================
    # ✅ API → BFF
    # ============================
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass https://bff_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ SIGNALR
    # ============================
    location /hubs/ {
        limit_req zone=hubs burst=10 nodelay;
        proxy_pass https://bff_upstream;

        # Standard WebSocket handshake negotiation protocol mapping
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Forward precise client environment details downstream
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Crucial for persistent real-time streaming connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ HEALTH
    # ============================
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # ============================
    # ✅ SECURITY HEADERS
    # ============================
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; style-src-attr 'sha256-aqNNdDLnnrDOnTNdkJpYlAxKVJtLt9CtFLklmInuUAE='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
    add_header Content-Language "en-CA";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ============================
    # ✅ BFF AUTH ROUTES
    # ============================
    location /login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass https://bff_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /logout {
        proxy_pass https://bff_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /signin-oidc {
        proxy_pass https://bff_upstream;

        proxy_http_version 1.1;

        # ✅ REQUIRED HEADERS
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ✅ CRITICAL FOR FORM POST
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;

        # ✅ VERY IMPORTANT
        proxy_request_buffering off;

        # ✅ prevent connection issues
        proxy_set_header Connection "";

        proxy_ssl_verify off;
    }

    location /signout-callback-oidc {
        proxy_pass https://bff_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # ============================
    # ✅ AUTH SERVER (DIRECT)
    # ============================

    location /.well-known/ {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_ssl_verify off;
    }

    location /connect/ {
        limit_req zone=token burst=10 nodelay;
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_ssl_verify off;
    }

    location ~ ^/account/register(/?|$) {
        limit_req zone=register burst=10 nodelay;
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }

    location /account/external/ {
        limit_req zone=external burst=10 nodelay;
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }

    location /account/ {
        limit_req zone=account burst=10 nodelay;
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ EXTERNAL OAUTH CALLBACKS
    # ============================

    location /signin-google {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
        proxy_request_buffering off;
        proxy_set_header Connection "";

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ AUTH STATIC ASSETS
    # ============================
    location ^~ /css/auth.css {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location ^~ /js/auth-page.js {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # ============================
    # ✅ RATE LIMITED ERROR PAGE
    # ============================
    error_page 429 /rate-limited.html;

    location = /rate-limited.html {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 429 '<!DOCTYPE html>
<html lang="en-CA" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Limited - Promise Model Online</title>
<link href="/css/auth.css" rel="stylesheet">
<style>
  .rate-limited-icon svg { width: 48px; height: 48px; }
  .retry-after { font-size: 0.8125rem; color: var(--color-text-muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="form-div auth-card">
  <div class="auth-card-icon rate-limited-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4"/>
      <path d="M12 16h.01"/>
    </svg>
  </div>
  <h2 class="auth-card-heading">Too Many Requests</h2>
  <p class="auth-card-subtitle">Please wait a moment and try again.</p>
  <p class="retry-after">Rate limit exceeded. Try again shortly.</p>
  <p class="auth-link"><a href="/">Return home</a></p>
</div>
</body>
</html>';
    }

    # ============================
    # ✅ UMAMI TRACKING (proxy script + api only; dashboard via SSH)
    #    SSH tunnel: ssh -L 3000:127.0.0.1:3000 user@server, then https://localhost:3000
    # ============================
    location = /umami/script.js {
        proxy_pass http://umami:3000/script.js;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location = /umami/api/telemetry {
        access_log off;
        default_type application/json;
        return 204;
    }

    location /umami/api/ {
        proxy_pass http://umami:3000/api/;
    }
}

# ============================
# ✅ UMAMI ANALYTICS SUBDOMAIN (informational)
#    Dashboard is SSH-only. This block serves usage info if ever queried.
# ============================
server {
    listen 9000 ssl;
    server_name analytics.*;

    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    location / {
        return 200 "Umami analytics is SSH-only.\nDashboard: ssh -L 3000:127.0.0.1:3000 user@server\nThen open https://localhost:3000\n";
        add_header Content-Type text/plain;
    }
}
