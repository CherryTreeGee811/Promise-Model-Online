server {
    listen 4000;
    server_name localhost;

    large_client_header_buffers 4 256k;

    root /app/wwwroot;
    index index.html;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 "User-agent: *
Disallow: /api/
Disallow: /hubs/
Disallow: /login
Disallow: /logout
Disallow: /register
Disallow: /account/
Disallow: /connect/
Disallow: /.well-known/
Disallow: /signin-oidc
Disallow: /signout-callback-oidc
Disallow: /signin-google
Disallow: /health
Disallow: /change-password

Sitemap: https://$host/sitemap.xml
";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://$host/</loc>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>';
    }

    location = /favicon.ico {
        return 301 /images/favicon.ico;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-01QCnpni8n/AK7RwVFswDqqWdAWCI20dHYx1Zqoi/gg=' 'sha256-Er80AO95jpSF3nGEdfbV1/qIJC1d82CCRs6/RbdKzDo='; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; style-src-attr 'sha256-aqNNdDLnnrDOnTNdkJpYlAxKVJtLt9CtFLklmInuUAE='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
        add_header Content-Language "en-CA";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(?:mjs|js)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.css$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
