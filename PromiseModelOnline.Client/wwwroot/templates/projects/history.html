<h1 id="project-title">Project activity</h1>
<p id="error-text" class="text-danger d-none"></p>

<div id="audit-history-loading" class="text-center py-4" hidden>
    <div class="spinner-border text-primary" role="status" aria-live="polite" aria-label="Loading project activity">
        <span class="visually-hidden">Loading project activity...</span>
    </div>
</div>

<div id="audit-history-list"></div>

<div id="audit-history-pagination" class="mt-3"></div>

<div class="d-flex justify-content-start align-items-center mt-3 gap-2">
    <button id="export-csv-btn" type="button" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-download"></i> Export CSV
    </button>
    <button id="export-json-btn" type="button" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-download"></i> Export JSON
    </button>
</div>

<div class="d-flex justify-content-start align-items-center mt-3">
    <button id="back-to-projects-btn" type="button" class="btn btn-outline-secondary">Back to Projects</button>
</div>
