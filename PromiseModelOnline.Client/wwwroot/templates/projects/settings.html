<h1>Project Settings</h1>

<p id="error-text"></p>
<p id="success-text"></p>

<div class="project-settings-sections">
    <section class="detail-card">
        <h2>Edit Project</h2>
        <form id="project-settings-form">
            <label id="project-title-label" for="project-title-input">Title:</label>
            <div class="inline-edit-wrapper">
                <p id="project-title-view" class="inline-edit-view inline-edit-view--input"></p>
                <button id="edit-project-title-btn" class="btn btn-success btn-sm inline-edit-btn" type="button" title="Edit title"><i class="bi bi-pencil"></i></button>
                <input id="project-title-input" class="form-control" type="text" name="name" required maxlength="200" placeholder="Project title" style="display:none">
            </div>

            <label id="project-description-label" for="project-description-input">Description:</label>
            <div class="inline-edit-wrapper">
                <p id="project-description-view" class="inline-edit-view"></p>
                <button id="edit-project-desc-btn" class="btn btn-success btn-sm inline-edit-btn" type="button" title="Edit description"><i class="bi bi-pencil"></i></button>
                <textarea id="project-description-input" class="form-control" name="description" maxlength="1000" placeholder="Project description" style="display:none"></textarea>
            </div>

            <div class="field-actions">
                <button id="save-project-settings-btn" class="btn btn-primary" type="submit">Save Changes</button>
                <a href="/projects" class="btn btn-outline-secondary" id="cancel-project-settings-link" data-nav>Back to projects</a>
            </div>
        </form>
    </section>

    <section class="detail-card">
        <h2>Project Summary</h2>
        <div id="project-summary-loading" class="text-center py-4" hidden>
            <div class="spinner-border text-primary spinner-xl" role="status" aria-live="polite" aria-label="Loading project summary">
                <span class="visually-hidden">Loading project summary...</span>
            </div>
        </div>
        <div id="project-summary-panel"></div>
    </section>

    <section class="detail-card">
        <h2>Export</h2>
        <p>Download a JSON snapshot of this project and its hierarchy.</p>
        <button id="export-project-btn" class="btn btn-outline-primary d-inline-flex align-items-center gap-2" type="button" data-bs-trigger="manual" data-bs-placement="top" data-bs-content="Exported!">
            <i class="bi bi-download" aria-hidden="true"></i>
            <span>Export JSON</span>
        </button>
    </section>

    <section class="detail-card">
        <h2>Delete Project</h2>
        <p>This permanently deletes the project and everything under it. Type <strong id="project-delete-confirmation-text"></strong> to enable deletion.</p>
        <label id="project-delete-confirmation-label" for="project-delete-confirmation-input">Confirmation phrase:</label>
        <input id="project-delete-confirmation-input" class="form-control" type="text" placeholder="Type the confirmation phrase">
        <div class="field-actions">
            <button id="delete-project-btn" class="btn btn-danger d-inline-flex align-items-center gap-2" type="button" disabled>
                <span id="delete-project-btn-spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                <span id="delete-project-btn-label">Delete Project</span>
            </button>
        </div>
    </section>
</div>
