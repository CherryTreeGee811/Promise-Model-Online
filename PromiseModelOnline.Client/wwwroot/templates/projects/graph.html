<h1>Project Graph</h1>

<p id="error-text"></p>
<p id="success-text"></p>

<div id="graph-filter-bar" class="graph-filter-bar">
    <div id="graph-filter-summary" class="graph-filter-summary" aria-live="polite"></div>
</div>

<div id="graph-viewport" class="graph-viewport position-relative">
	<div id="graph-zoom-controls" class="position-absolute bottom-0 end-0 m-3 d-flex gap-1 z-1" role="toolbar" aria-label="Graph zoom controls">
		<button id="graph-zoom-in" class="btn btn-light border btn-sm graph-zoom-btn" type="button" aria-label="Zoom in">
			<i class="bi bi-plus-lg" aria-hidden="true"></i>
		</button>
		<button id="graph-zoom-out" class="btn btn-light border btn-sm graph-zoom-btn" type="button" aria-label="Zoom out">
			<i class="bi bi-dash-lg" aria-hidden="true"></i>
		</button>
		<button id="graph-zoom-reset" class="btn btn-light border btn-sm graph-zoom-btn" type="button" aria-label="Reset zoom">
			<i class="bi bi-arrows-angle-expand" aria-hidden="true"></i>
		</button>
	</div>
	<div id="graph-loading-state" class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center z-3 d-none graph-loading-state" aria-hidden="true">
		<div class="spinner-border text-primary" role="status" aria-live="polite" aria-label="Loading project graph">
			<span class="visually-hidden">Loading project graph...</span>
		</div>
	</div>
	<div id="graph-content"></div>
</div>
