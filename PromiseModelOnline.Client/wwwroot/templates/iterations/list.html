<h1>Iteration History</h1>
<div id="project-title" class="text-secondary mb-3"></div>
<p id="error-text"></p>

<div id="iterations-list">
</div>

<div id="iteration-detail" class="d-none">
    <div class="detail-card">
        <h2 id="iteration-title"></h2>

        <div id="iteration-loading" class="d-flex justify-content-center align-items-center py-5" hidden>
            <div class="spinner-border text-primary" role="status" aria-live="polite" aria-label="Loading iteration details">
                <span class="visually-hidden">Loading iteration details...</span>
            </div>
        </div>

        <div id="iteration-burndown-container" class="mb-4">
            <h3>Burndown</h3>
            <div id="iteration-burndown-canvas"></div>
        </div>

        <h3>Strides</h3>
        <div id="stride-details" class="mb-3"></div>

        <div class="field-actions">
            <button id="back-to-iterations-btn" type="button" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                Back to iterations
            </button>
        </div>
    </div>
</div>
