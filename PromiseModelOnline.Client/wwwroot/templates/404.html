<div class="error-page">

      <i class="bi bi-compass error-icon"></i>
    </div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary d-inline-flex align-items-center gap-2" data-nav>
        <i class="bi bi-house" aria-hidden="true"></i>
        <span>Go home</span>
      </a>
      <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center gap-2" data-action="back">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>Go back</span>
      </button>
    </div>
  </div>
</div>
