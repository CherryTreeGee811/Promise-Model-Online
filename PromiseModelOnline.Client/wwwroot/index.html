<script>
    (function() {
        var banner = document.getElementById('cookie-banner');
        var dismissBtn = document.getElementById('cookie-banner-dismiss');

        } else {

            localStorage.setItem('cookie-consent', 'dismissed');
            banner.style.display = 'none';

</script>
