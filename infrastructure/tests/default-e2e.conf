server {
    listen 9000 ssl;
    server_name localhost;


    # ✅ FIX LARGE HEADERS (OIDC COOKIES)
    proxy_buffer_size        128k;
    proxy_buffers            8 256k;
    proxy_busy_buffers_size  256k;

    # ✅ ALSO IMPORTANT
    large_client_header_buffers 4 256k;


    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    root /app/wwwroot;
    index index.html;

    # ============================
    # ✅ ROBOTS.TXT (dynamic host for Sitemap)
    # ============================
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 "User-agent: *
Disallow: /api/
Disallow: /hubs/
Disallow: /login
Disallow: /logout
Disallow: /register
Disallow: /account/
Disallow: /connect/
Disallow: /.well-known/
Disallow: /signin-oidc
Disallow: /signout-callback-oidc
Disallow: /signin-google
Disallow: /health
Disallow: /change-password

Sitemap: https://$host/sitemap.xml
";
    }

    # ============================
    # ✅ SITEMAP.XML (Google Search, dynamic host)
    # ============================
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://$host/</loc>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>';
    }

    # ============================
    # ✅ SPA ROUTING
    # ============================
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
        add_header Content-Language "en-CA";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ============================
    # ✅ STATIC ASSETS (CACHE)
    # ============================    
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # ============================
    # ✅ API → BFF
    # ============================
    location /api/ {
        proxy_pass https://bff_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ SIGNALR
    # ============================
    location /hubs/ {
        proxy_pass https://bff_upstream;

        # Standard WebSocket handshake negotiation protocol mapping
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Forward precise client environment details downstream
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial for persistent real-time streaming connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ HEALTH
    # ============================
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # ============================
    # ✅ SECURITY HEADERS
    # ============================
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
    add_header Content-Language "en-CA";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ============================
    # ✅ BFF AUTH ROUTES
    # ============================
    location /login {
        proxy_pass https://bff_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location /logout {
        proxy_pass https://bff_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location /signin-oidc {
        proxy_pass https://bff_upstream;

        proxy_http_version 1.1;

        # ✅ REQUIRED HEADERS
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ✅ CRITICAL FOR FORM POST
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;

        # ✅ VERY IMPORTANT
        proxy_request_buffering off;

        # ✅ prevent connection issues
        proxy_set_header Connection "";

        proxy_ssl_verify off;
    }

    location /signout-callback-oidc {
        proxy_pass https://bff_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    # ============================
    # ✅ AUTH SERVER (DIRECT)
    # ============================

    location /.well-known/ {
        proxy_pass https://promisemodelonline.auth:8060;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
    }

    location /connect/ {
        proxy_pass https://promisemodelonline.auth:8060;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_verify off;
    }

    location ~ ^/account/register(/?|$) {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }

    location /account/ {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ EXTERNAL OAUTH CALLBACKS
    # ============================

    location /signin-google {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
        proxy_request_buffering off;
        proxy_set_header Connection "";

        proxy_ssl_verify off;
    }

    # ============================
    # ✅ AUTH STATIC ASSETS
    # ============================
    location ^~ /css/auth.css {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    location ^~ /js/auth-page.js {
        proxy_pass https://promisemodelonline.auth:8060;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}
