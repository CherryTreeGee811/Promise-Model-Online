server {
    listen 4000;
    server_name localhost;

    root /app/wwwroot;
    index index.html;

    location = /health {
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        return 200 "User-agent: *\nAllow: /\nSitemap: https://$host/sitemap.xml\n";
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        add_header Cache-Control "public, max-age=86400";
        return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://$host/</loc><priority>1.0</priority></url>\n</urlset>\n';
    }

    location = /favicon.ico {
        return 301 /images/favicon.ico;
    }

    location ~* \.(mjs|js)$ {
        expires 1h;
        try_files $uri =404;
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /manifest.json {
        expires 1h;
        try_files $uri =404;
    }

    location /sw.mjs {
        expires 0;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-01QCnpni8n/AK7RwVFswDqqWdAWCI20dHYx1Zqoi/gg=' 'sha256-Er80AO95jpSF3nGEdfbV1/qIJC1d82CCRs6/RbdKzDo='; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; style-src-attr 'sha256-aqNNdDLnnrDOnTNdkJpYlAxKVJtLt9CtFLklmInuUAE='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
        add_header Content-Language "en-CA";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
