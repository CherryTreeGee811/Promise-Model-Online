services:
  promisemodelonline.client:
    container_name: promisemodelonlineclient
    hostname: localhost
    ports:
      - "9000:9000/tcp"
    networks:
      - promisemodelonline-client-ui-test-net
    build:
      context: ../..
      dockerfile: PromiseModelOnline.Client/Dockerfile
    volumes:
      - ./nginx-test.conf:/etc/nginx/nginx.conf
      - ./default-test.conf:/etc/nginx/conf.d/default.conf

networks:
  promisemodelonline-client-ui-test-net:
    driver: bridge
