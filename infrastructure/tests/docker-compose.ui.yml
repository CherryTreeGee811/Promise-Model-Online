services:
  promisemodelonline.client:
    container_name: promisemodelonlineclient
    hostname: localhost
    ports:
      - "9000:9000/tcp"
    build:
      context: ../..
      dockerfile: PromiseModelOnline.Client/Dockerfile

  promisemodelonline.gateway:
    image: wiremock/wiremock:latest
    container_name: promisemodelonlinegatewaymock
    ports:
      - "8010:8010/tcp"
    command: >
      --https-port 8010
      --verbose
    volumes:
      - ../../PromiseModelOnline.Client.Tests/wiremock-gateway/mappings:/home/wiremock/mappings:ro
      - ../../PromiseModelOnline.Client.Tests/wiremock-gateway/__files:/home/wiremock/__files:ro

networks:
  promisemodelonline-net:
    driver: bridge