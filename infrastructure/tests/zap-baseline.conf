# ZAP baseline config for development/E2E CI environment.
# Warnings that are expected dev-mode behavior (no real external services
# or production TLS) are set to IGNORE. All other findings are FAIL.
#
# This file is used by zap-full-scan.py via the -c flag.
#
# Format: PLUGIN_ID|STATUS
#   STATUS: IGNORE, INFO, WARN, FAIL

# ============================================================================
# Expected dev-mode artifacts (no real external services running)
# ============================================================================

# In Page Banner Information Leak [10009]
# /umami/script.js returns 404 — Umami not running in CI
10009|IGNORE

# Cookie Without Secure Flag [10011]
# BFF/OpenIddict cookies used in OIDC flow — no Secure flag on localhost HTTP
10011|IGNORE

# CSP Header Not Set [10038]
# /umami/script.js returns 404 — no CSP on error pages
10038|IGNORE

# Cookie with SameSite Attribute None [10054]
# OpenIddict cookies use SameSite=None for cross-domain OIDC redirects
10054|IGNORE

# Cross-Origin-Embedder-Policy Not Set [90004]
# Unnecessary for SPA — Content is same-origin only via CSP
90004|IGNORE

