server {
    listen 9000 ssl;
    listen 8080;
    server_name localhost;

    proxy_buffer_size        128k;
    proxy_buffers            8 256k;
    proxy_busy_buffers_size  256k;
    large_client_header_buffers 4 256k;

    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    location /api/ {
        proxy_pass https://bff_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /hubs/ {
        proxy_pass https://bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ssl_verify off;
    }

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location /login {
        proxy_pass https://bff_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /logout {
        proxy_pass https://bff_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /signin-oidc {
        proxy_pass https://bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_ssl_verify off;
    }

    location /signout-callback-oidc {
        proxy_pass https://bff_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /.well-known/ {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location /connect/ {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location ~ ^/account/register(/?|$) {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /account/external/ {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /account/ {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
    }

    location /signin-google {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Content-Length $content_length;
        proxy_set_header Content-Type $content_type;
        proxy_request_buffering off;
        proxy_set_header Connection "";
        proxy_ssl_verify off;
    }

    location ^~ /css/auth.css {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    location ^~ /js/auth-page.js {
        proxy_pass https://promisemodelonline-auth:8060;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    error_page 429 /rate-limited.html;

    location = /rate-limited.html {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 429 '<!DOCTYPE html>
<html lang="en-CA" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Limited - Promise Model Online</title>
<link href="/css/auth.css" rel="stylesheet">
<style>
  .rate-limited-icon svg { width: 48px; height: 48px; }
  .retry-after { font-size: 0.8125rem; color: var(--color-text-muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="form-div auth-card">
  <div class="auth-card-icon rate-limited-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v4"/>
      <path d="M12 16h.01"/>
    </svg>
  </div>
  <h2 class="auth-card-heading">Too Many Requests</h2>
  <p class="auth-card-subtitle">Please wait a moment and try again.</p>
  <p class="retry-after">Rate limit exceeded. Try again shortly.</p>
  <p class="auth-link"><a href="/">Return home</a></p>
</div>
</body>
</html>';
    }

    location = /umami/script.js {
        proxy_pass http://umami:3000/script.js;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location = /umami/api/telemetry {
        access_log off;
        default_type application/json;
        return 204;
    }

    location /umami/api/ {
        proxy_pass http://umami:3000/api/;
    }

    location / {
        proxy_pass http://promisemodelonlineclient:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 9000 ssl;
    server_name analytics.*;

    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    location / {
        return 200 "Umami analytics is SSH-only.\nDashboard: ssh -L 3000:127.0.0.1:3000 user@server\nThen open https://localhost:3000\n";
        add_header Content-Type text/plain;
    }
}
