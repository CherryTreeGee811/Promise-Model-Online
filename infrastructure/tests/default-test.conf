server {
    listen 9000 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    root /app/wwwroot;
    index index.html;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        return 200 "User-agent: *
Disallow: /api/
Disallow: /hubs/
Disallow: /login
Disallow: /logout
Disallow: /register
Disallow: /account/
Disallow: /connect/
Disallow: /.well-known/
Disallow: /signin-oidc
Disallow: /signout-callback-oidc
Disallow: /signin-google
Disallow: /health
Disallow: /change-password

Sitemap: https://$host/sitemap.xml
";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://$host/</loc>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'sha256-j7OoGArf6XW6YY4cAyS3riSSvrJRqpSi1fOF9vQ5SrI='; style-src 'self' https://cdn.jsdelivr.net 'sha256-6bWmViGaXSDcAuOcecNeMlT+fQZfAug0V7JjEDqCCrg=' 'sha256-8DUtwwn1Qpdjl+THM+mP6UoKIi5RMrSsH6XNdn63JmY='; img-src 'self' data:; font-src https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net wss://localhost:9000 https://localhost:9000; manifest-src 'self';";
    add_header Content-Language "en-CA";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}
