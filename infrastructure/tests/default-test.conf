server {
    listen 9000 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;

    root /app/wwwroot;
    index index.html;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        return 200 "User-agent: *
Disallow: /api/
Disallow: /hubs/
Disallow: /login
Disallow: /logout
Disallow: /register
Disallow: /account/
Disallow: /connect/
Disallow: /.well-known/
Disallow: /signin-oidc
Disallow: /signout-callback-oidc
Disallow: /signin-google
Disallow: /health
Disallow: /change-password

Sitemap: https://$host/sitemap.xml
";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url>
    <loc>https://$host/</loc>
    <changefreq>weekly</changefreq>
    <priority>1.0</priority>
  </url>
</urlset>';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /umami/script.js {
        access_log off;
        default_type application/javascript;
        return 200 '/* umami stub — disabled in test environment */';
    }

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
    add_header Content-Language "en-CA";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), idle-detection=(), accelerometer=()";
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /umami/api/telemetry {
        access_log off;
        default_type application/json;
        return 204;
    }
}
