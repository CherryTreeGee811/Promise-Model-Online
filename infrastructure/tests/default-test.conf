server {
    listen 9000 ssl;
    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/key.pem;
    server_name localhost;

    root /app/wwwroot;
    index index.html;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        return 200 "User-agent: *\nDisallow: /api/\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Mock BFF / API / OIDC endpoints ──────────────────────────────────────
    # These prevent 405 console errors when the SPA makes backend calls
    # in the test environment where no real backend is running.

    # API — session check (most frequent console error)
    location /api/users/me {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://localhost:9000";
        add_header Access-Control-Allow-Credentials "true";
        add_header Cache-Control "no-store";
        return 401 '{"status":401,"message":"Unauthenticated"}';
    }

    # API — catch-all for any other /api/ calls
    location /api/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://localhost:9000";
        add_header Access-Control-Allow-Credentials "true";
        add_header Cache-Control "no-store";
        return 401 '{"error":"unauthorized"}';
    }

    # OIDC login / register / signin paths — return HTML shell
    location = /login {
        default_type text/html;
        add_header Cache-Control "no-store";
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"></head><body><div id="content"></div><script src="/dist/js/main.js" type="module"></script></body></html>';
    }

    location = /register {
        default_type text/html;
        add_header Cache-Control "no-store";
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"></head><body><div id="content"></div><script src="/dist/js/main.js" type="module"></script></body></html>';
    }

    location = /signin-oidc {
        default_type text/html;
        add_header Cache-Control "no-store";
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"></head><body><div id="content"></div><script src="/dist/js/main.js" type="module"></script></body></html>';
    }

    location = /signout-callback-oidc {
        default_type text/html;
        add_header Cache-Control "no-store";
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"></head><body><div id="content"></div><script src="/dist/js/main.js" type="module"></script></body></html>';
    }

    # OIDC authorize — redirect to login (as real IdP does when unauthenticated)
    location = /connect/authorize {
        add_header Cache-Control "no-store";
        return 302 /account/login;
    }

    # OIDC token — reject with unsupported grant (matching test expectations)
    location = /connect/token {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 400 '{"error":"unsupported_grant_type"}';
    }

    # OIDC end-session — redirect home
    location = /connect/logout {
        add_header Cache-Control "no-store";
        return 302 /;
    }

    # OIDC discovery document
    location /.well-known/openid-configuration {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        return 200 '{"issuer":"https://localhost:9000","authorization_endpoint":"https://localhost:9000/connect/authorize","token_endpoint":"https://localhost:9000/connect/token","end_session_endpoint":"https://localhost:9000/connect/logout","introspection_endpoint":"https://localhost:9000/connect/introspect","revocation_endpoint":"https://localhost:9000/connect/revoke","jwks_uri":"https://localhost:9000/.well-known/jwks","scopes_supported":["openid","profile","email","offline_access","projects.read","projects.write"],"response_types_supported":["code"],"response_modes_supported":["query","fragment","form_post"],"grant_types_supported":["authorization_code","refresh_token"],"subject_types_supported":["public"],"id_token_signing_alg_values_supported":["RS256"],"token_endpoint_auth_methods_supported":["none"],"claims_supported":["sub","name","email","email_verified"],"code_challenge_methods_supported":["S256"],"require_pkce":true}';
    }

    # Auth server pages
    location /account/ {
        default_type text/html;
        add_header Cache-Control "no-store";
        return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"></head><body><div id="content"></div><script src="/dist/js/main.js" type="module"></script></body></html>';
    }

    # SignalR hub — prevent 405 on negotiate
    location /hubs/ {
        add_header Cache-Control "no-store";
        return 204;
    }

    # Umami analytics stub
    location /umami/ {
        add_header Cache-Control "no-store";
        return 204;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /umami/script.js {
        access_log off;
        default_type application/javascript;
        return 200 '/* umami stub */';
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-01QCnpni8n/AK7RwVFswDqqWdAWCI20dHYx1Zqoi/gg=' 'sha256-Er80AO95jpSF3nGEdfbV1/qIJC1d82CCRs6/RbdKzDo='; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
}
