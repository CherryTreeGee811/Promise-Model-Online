server {
    listen 8080;
    server_name localhost;

    root /app/wwwroot;
    index index.html;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        return 200 "User-agent: *\nDisallow: /api/\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /umami/script.js {
        access_log off;
        default_type application/javascript;
        return 200 '/* umami stub */';
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-01QCnpni8n/AK7RwVFswDqqWdAWCI20dHYx1Zqoi/gg=' 'sha256-Er80AO95jpSF3nGEdfbV1/qIJC1d82CCRs6/RbdKzDo='; style-src 'self' 'sha256-WWn0l9kVjXaC+CGcbxP6Zyac31v1Cjkx2VMnFR3uVng='; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';";
}
