---
- name: Rollback Docker Swarm stack by commit SHA
  hosts: vm_host
  gather_facts: false

  vars:
    stack_name: promisemodelonline
    services:
      - promisemodelonline-api
      - promisemodelonline-auth
      - promisemodelonline-bff
      - promisemodelonline-client
      - promisemodelonline-proxy
    sha: ""
    service_override: {}

  tasks:
    - name: Fail if no SHA provided
      ansible.builtin.fail:
        msg: >
          You must provide a commit SHA.
          Usage: ansible-playbook rollback-stack.yml -e 'sha=abc1234'
          To pin a specific service to a different SHA:
          -e '{"service_override":{"promisemodelonline-client":"def5678"}}'
      when: sha | length == 0

    - name: Rollback services to specific commit SHA tag
      ansible.builtin.shell:
        cmd: |
          IMG="cherrytree811/promisemodelonline{{ item | regex_replace('^promisemodelonline-', '') }}"
          TAG="{{ service_override[item] | default(sha) }}"
          echo "Rolling back {{ item }} to ${IMG}:${TAG}..."
          sudo docker service update --image "${IMG}:${TAG}" "{{ stack_name }}_{{ item }}" 2>&1
      loop: "{{ services }}"
      register: rollback_results
      ignore_errors: true
      changed_when: true

    - name: Report any services that failed to rollback
      ansible.builtin.debug:
        msg: >
          WARNING: Rollback failed for {{ item.item }} —
          tag {{ service_override[item.item] | default(sha) }} not found for that image.
          No changes made to this service.
      loop: "{{ rollback_results.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item is failed

    - name: Wait for services to stabilize after rollback
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for i in $(seq 1 60); do
            FAILED=$(sudo docker service ls \
              --filter "name={{ stack_name }}" \
              --format "{{ '{{' }}.Replicas{{ '}}' }}" 2>/dev/null \
              | grep -vE '^[0-9]+/[0-9]+' | grep -v '^$' || true)
            if [ -z "$FAILED" ]; then
              echo "All services stable"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Timed out waiting for services"
          sudo docker service ls --filter "name={{ stack_name }}"
          exit 1
      args:
        executable: /bin/bash
      changed_when: true

    - name: Print stack status after rollback
      ansible.builtin.command:
        cmd: sudo docker service ls --filter "name={{ stack_name }}"
      register: status_result
      changed_when: false

    - name: Print rollback summary
      ansible.builtin.debug:
        msg: "{{ status_result.stdout }}"
