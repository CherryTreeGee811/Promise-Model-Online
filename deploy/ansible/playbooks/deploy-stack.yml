---
- name: Deploy Docker Swarm stack to VM
  hosts: vm_host
  gather_facts: true

  vars:
    deploy_root: "{{ playbook_dir }}/../../"
    project_root: "{{ pmo_repo_root }}"
    stack_name: promisemodelonline

  tasks:
    - name: Wait for cloud-init to complete
      ansible.builtin.command:
        cmd: sudo cloud-init status --wait
      changed_when: false

    - name: Create project directories on VM
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ project_root }}"
        - "{{ project_root }}/secrets"
        - "{{ project_root }}/scripts"
        - "{{ project_root }}/keys/client"
        - "{{ project_root }}/keys/auth"
        - "{{ project_root }}/keys/bff"
        - "{{ project_root }}/keys/proxy"

    - name: Sync deploy directory to VM
      ansible.posix.synchronize:
        src: "{{ deploy_root }}"
        dest: "{{ project_root }}"
        rsync_opts:
          - "--exclude=secrets"
          - "--exclude=ansible"
          - "--exclude=.DS_Store"
        delete: true

    - name: Create secret files on VM
      no_log: true
      ansible.builtin.copy:
        dest: "{{ project_root }}/secrets/{{ item }}"
        content: "{{ lookup('file', deploy_root ~ '/secrets/' ~ item) | trim }}"
        mode: "0644"
      loop:
        - auth_db_password.txt
        - api_db_password.txt
        - cert_password.txt
        - google_client_secret.txt
        - sendgrid_api_key.txt
        - umami_db_password.txt
        - umami_admin_password.txt
        - cloudflare_tunnel_token.txt
        - db_sa_password.txt
        - auth_registration_key.txt
        - github_token.txt

    - name: Set permissions on certs
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
      loop:
        - "{{ project_root }}/keys/client/key.pem"
        - "{{ project_root }}/keys/client/cert.pem"
        - "{{ project_root }}/keys/auth/key.pem"
        - "{{ project_root }}/keys/auth/cert.pem"
        - "{{ project_root }}/keys/auth/cert.pfx"
        - "{{ project_root }}/keys/bff/key.pem"
        - "{{ project_root }}/keys/bff/cert.pem"
        - "{{ project_root }}/keys/proxy/key.pem"
        - "{{ project_root }}/keys/proxy/cert.pem"

    - name: Initialize Docker Swarm (idempotent)
      ansible.builtin.shell:
        cmd: sudo docker swarm init 2>&1 || true
      register: swarm_init
      changed_when: false

    - name: Create Docker Swarm secrets from files
      ansible.builtin.shell:
        cmd: |
          sudo docker secret inspect "pmo_{{ item }}" > /dev/null 2>&1 || \
          sudo docker secret create "pmo_{{ item }}" "{{ project_root }}/secrets/{{ item }}.txt"
      loop:
        - db_sa_password
        - api_db_password
        - auth_db_password
        - google_client_secret
        - sendgrid_api_key
        - cert_password
        - umami_db_password
        - umami_admin_password
        - cloudflare_tunnel_token
        - auth_registration_key
        - github_token
      changed_when: true

    - name: Check if cloudflared should use Quick Tunnel mode
      ansible.builtin.shell:
        cmd: >
          set -o pipefail;
          grep -q "REPLACE_ME\|PLACEHOLDER"
          "{{ project_root }}/secrets/cloudflare_tunnel_token.txt"
          2>/dev/null && echo "quick" || echo "dns"
      register: tunnel_mode_result
      changed_when: false

    - name: Set tunnel mode fact
      ansible.builtin.set_fact:
        tunnel_mode: "{{ tunnel_mode_result.stdout }}"

    - name: Override cloudflared command for Quick Tunnel mode
      ansible.builtin.replace:
        path: "{{ project_root }}/docker-stack.yml"
        regexp: '^(\s+)command: tunnel --no-autoupdate run$'
        replace: '\1command: tunnel --url http://promisemodelonline-proxy:8080 --no-autoupdate'
      when: tunnel_mode == "quick"

    - name: Pull Docker images from registry
      ansible.builtin.shell:
        cmd: |
          for img in \
            cherrytree811/promisemodelonlineapi \
            cherrytree811/promisemodelonlineauth \
            cherrytree811/promisemodelonlinebff \
            cherrytree811/promisemodelonlineclient \
            cherrytree811/promisemodelonlineproxy; do
            sudo docker pull "$img" 2>&1
          done
      register: pull_result
      changed_when: "'Downloaded' in pull_result.stdout or 'Pulled' in pull_result.stdout"

    - name: Deploy Docker Swarm stack
      ansible.builtin.shell:
        cmd: |
          set -a
          source {{ project_root }}/.env
          set +a
          export DB_SA_PASSWORD=$(cat {{ project_root }}/secrets/db_sa_password.txt)
          export UMAMI_DB_PASSWORD=$(cat {{ project_root }}/secrets/umami_db_password.txt)
          sudo -E docker stack deploy -c docker-stack.yml "{{ stack_name }}"
      args:
        chdir: "{{ project_root }}"
        executable: /bin/bash
      register: deploy_result
      changed_when: true

    - name: Wait for all services to stabilize
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for i in $(seq 1 60); do
            FAILED=$(sudo docker service ls \
              --filter "name={{ stack_name }}" \
              --format "{{ '{{' }}.Replicas{{ '}}' }}" 2>/dev/null \
              | grep -vE '^[0-9]+/[0-9]+' | grep -v '^$' || true)
            if [ -z "$FAILED" ]; then
              echo "All services stable"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Timed out waiting for services"
          sudo docker service ls --filter "name={{ stack_name }}"
          exit 1
      args:
        chdir: "{{ project_root }}"
        executable: /bin/bash
      register: health_result
      changed_when: true

    - name: Wait for cloudflared to connect and extract tunnel URL (Quick Tunnel only)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for i in $(seq 1 60); do
            URL=$(sudo docker service logs "{{ stack_name }}_cloudflared" --tail 20 2>&1 \
              | grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)
            if [ -n "$URL" ]; then
              echo "$URL"
              exit 0
            fi
            sleep 5
          done
          echo "TIMEOUT: tunnel URL not found in cloudflared logs"
          sudo docker service logs "{{ stack_name }}_cloudflared" --tail 50
          exit 1
      register: tunnel_url_result
      changed_when: false
      when: tunnel_mode == "quick"
      args:
        executable: /bin/bash

    - name: Set tunnel URL fact (Quick Tunnel only)
      ansible.builtin.set_fact:
        tunnel_url: "{{ tunnel_url_result.stdout }}"
      when: tunnel_mode == "quick"

    - name: Update .env with tunnel URL (Quick Tunnel only)
      ansible.builtin.replace:
        path: "{{ project_root }}/.env"
        regexp: '^APP_BASE_URL=.*'
        replace: 'APP_BASE_URL={{ tunnel_url }}'
      when: tunnel_mode == "quick"

    - name: Update auth service with real tunnel URL (Quick Tunnel only)
      ansible.builtin.shell:
        cmd: |
          sudo docker service update \
            --env-rm APP_BASE_URL \
            --env-rm AUTH_PUBLIC_ISSUER \
            --env-add APP_BASE_URL={{ tunnel_url }} \
            --env-add AUTH_PUBLIC_ISSUER={{ tunnel_url }} \
            "{{ stack_name }}_promisemodelonline-auth"
      changed_when: true
      when: tunnel_mode == "quick"

    - name: Update BFF service with real tunnel URL (Quick Tunnel only)
      ansible.builtin.shell:
        cmd: |
          sudo docker service update \
            --env-rm APP_BASE_URL \
            --env-rm AUTH_PUBLIC_ISSUER \
            --env-add APP_BASE_URL={{ tunnel_url }} \
            --env-add AUTH_PUBLIC_ISSUER={{ tunnel_url }} \
            "{{ stack_name }}_promisemodelonline-bff"
      changed_when: true
      when: tunnel_mode == "quick"

    - name: Update API service with real tunnel URL (Quick Tunnel only)
      ansible.builtin.shell:
        cmd: |
          sudo docker service update \
            --env-rm JwtSettings__Issuer \
            --env-add JwtSettings__Issuer={{ tunnel_url }} \
            "{{ stack_name }}_promisemodelonline-api"
      changed_when: true
      when: tunnel_mode == "quick"

    - name: Wait for services to stabilize after URL update (Quick Tunnel only)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for i in $(seq 1 60); do
            FAILED=$(sudo docker service ls \
              --filter "name={{ stack_name }}" \
              --format "{{ '{{' }}.Replicas{{ '}}' }}" 2>/dev/null \
              | grep -vE '^[0-9]+/[0-9]+' | grep -v '^$' || true)
            if [ -z "$FAILED" ]; then
              echo "All services stable"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Timed out waiting for services"
          sudo docker service ls --filter "name={{ stack_name }}"
          exit 1
      args:
        chdir: "{{ project_root }}"
        executable: /bin/bash
      changed_when: true
      when: tunnel_mode == "quick"

    - name: Print tunnel URL (Quick Tunnel only)
      ansible.builtin.debug:
        msg: "Quick Tunnel URL: {{ tunnel_url }}"
      when: tunnel_mode == "quick"

    - name: Print stack status
      ansible.builtin.command:
        cmd: sudo docker service ls --filter "name={{ stack_name }}"
      register: status_result
      changed_when: false

    - name: Print deployment summary
      ansible.builtin.debug:
        msg: "{{ status_result.stdout }}"
