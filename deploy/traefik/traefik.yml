# Traefik static configuration — entrypoints, providers, TLS
# Dev mode (compose): uses Docker provider (swarmMode defaults to false)
# Production (stack): overridden via command-line flag if needed

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: promisemodelonline-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  websecure:
    address: ":9000"

api:
  dashboard: true
  insecure: false

ping: {}

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: {}

serversTransport:
  insecureSkipVerify: true
