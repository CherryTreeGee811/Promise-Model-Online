# Traefik static configuration — entrypoints, providers, TLS
# Dev mode (compose): swarmMode=false, uses Docker provider
# Production (stack): swarmMode=true, overridden via command-line flag

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: promisemodelonline-net
    swarmMode: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  websecure:
    address: ":9000"
  web:
    address: ":8080"

api:
  dashboard: true
  insecure: false

log:
  level: INFO

accessLog: {}

metrics:
  prometheus: {}
