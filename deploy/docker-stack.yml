services:
  traefik:
    image: traefik:v3.7
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=promisemodelonline-net"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.websecure.address=:9000"
      - "--entryPoints.web.address=:8080"
      - "--log.level=INFO"
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./keys/client/cert.pem:/certs/cert.pem:ro
      - ./keys/client/key.pem:/certs/key.pem:ro
    configs:
      - source: traefik_dynamic_ratelimit
        target: /etc/traefik/dynamic/middleware-ratelimit.yml
      - source: traefik_dynamic_headers
        target: /etc/traefik/dynamic/middleware-headers.yml
      - source: traefik_dynamic_sticky
        target: /etc/traefik/dynamic/middleware-sticky.yml
      - source: traefik_dynamic_tls
        target: /etc/traefik/dynamic/tls.yml
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    command: tunnel --no-autoupdate run
    secrets:
      - source: pmo_cloudflare_tunnel_token
        target: cloudflare_tunnel_token
        mode: 0444
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  nginx-spa:
    image: cherrytree811/promisemodelonlineclient
    hostname: localhost
    networks:
      - promisemodelonline-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spa.rule=PathPrefix(`/`)"
      - "traefik.http.routers.spa.entrypoints=websecure"
      - "traefik.http.routers.spa.tls=true"
      - "traefik.http.routers.spa.priority=1"
      - "traefik.http.services.spa.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  promisemodelonline.bff:
    image: cherrytree811/promisemodelonlinebff
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=https://+:8010
      - APP_BASE_URL=${APP_BASE_URL}
      - AUTH_PUBLIC_ISSUER=${AUTH_PUBLIC_ISSUER}
      - AUTH_INTERNAL_AUTHORITY=${AUTH_INTERNAL_AUTHORITY}
      - AUTH_METADATA_ADDRESS=${AUTH_METADATA_ADDRESS}
      - DATA_PROTECTION_KEYS_PATH=${DATA_PROTECTION_KEYS_PATH}
    volumes:
      - bff-dp-keys:/app/dp-keys
      - ./keys/bff/cert.pem:/app/cert.pem:ro
      - ./keys/bff/key.pem:/app/key.pem:ro
    networks:
      - promisemodelonline-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bff-api.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.bff-api.entrypoints=websecure"
      - "traefik.http.routers.bff-api.tls=true"
      - "traefik.http.routers.bff-api.priority=20"
      - "traefik.http.routers.bff-api.middlewares=ratelimit-api@file,security-headers@file"
      - "traefik.http.routers.bff-hubs.rule=PathPrefix(`/hubs/`)"
      - "traefik.http.routers.bff-hubs.entrypoints=websecure"
      - "traefik.http.routers.bff-hubs.tls=true"
      - "traefik.http.routers.bff-hubs.priority=20"
      - "traefik.http.routers.bff-hubs.middlewares=ratelimit-hubs@file,sticky-hubs@file,security-headers@file"
      - "traefik.http.routers.bff-auth-internal.rule=PathPrefix(`/login`) || PathPrefix(`/logout`) || PathPrefix(`/signin-oidc`) || PathPrefix(`/signout-callback-oidc`)"
      - "traefik.http.routers.bff-auth-internal.entrypoints=websecure"
      - "traefik.http.routers.bff-auth-internal.tls=true"
      - "traefik.http.routers.bff-auth-internal.priority=20"
      - "traefik.http.routers.bff-auth-internal.middlewares=ratelimit-login@file,security-headers@file"
      - "traefik.http.services.bff.loadbalancer.server.port=8010"
      - "traefik.http.services.bff.loadbalancer.server.scheme=https"
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: '1'
          memory: 512M

  promisemodelonline.api:
    image: cherrytree811/promisemodelonlineapi
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8000
      - JwtSettings__Issuer=${AUTH_PUBLIC_ISSUER}
      - JwtSettings__Audience=promisemodelonline.api
      - JwtSettings__MetadataAddress=${AUTH_METADATA_ADDRESS}
      - Auth__RegistrationKey_FILE=/run/secrets/auth_registration_key
      - ConnectionStrings__MSSQL=Server=promisemodelonline.db,1433;Database=PromiseModelOnline;User Id=${PMO_API_DB_USER};Password_FILE=/run/secrets/api_db_password;TrustServerCertificate=true;
    secrets:
      - source: pmo_api_db_password
        target: api_db_password
        mode: 0444
      - source: pmo_auth_registration_key
        target: auth_registration_key
        mode: 0444
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  promisemodelonline.auth:
    image: cherrytree811/promisemodelonlineauth
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=https://+:8060
      - APP_BASE_URL=${APP_BASE_URL}
      - AUTH_PUBLIC_ISSUER=${AUTH_PUBLIC_ISSUER}
      - Certificates__Password_FILE=/run/secrets/cert_password
      - DATA_PROTECTION_KEYS_PATH=${DATA_PROTECTION_KEYS_PATH}
      - ConnectionStrings__MSSQL=Server=promisemodelonline.db,1433;Database=PromiseModelOnlineAuth;User Id=${AUTH_DB_USER};Password_FILE=/run/secrets/auth_db_password;TrustServerCertificate=true;
      - Authentication__Google__ClientId=${AUTH_GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret_FILE=/run/secrets/google_client_secret
      - SendGrid__ApiKey_FILE=/run/secrets/sendgrid_api_key
    volumes:
      - auth-dp-keys:/app/dp-keys
      - ./keys/auth/cert.pem:/app/cert.pem:ro
      - ./keys/auth/key.pem:/app/key.pem:ro
      - ./keys/auth/cert.pfx:/app/cert.pfx:ro
    secrets:
      - source: pmo_auth_db_password
        target: auth_db_password
        mode: 0444
      - source: pmo_cert_password
        target: cert_password
        mode: 0444
      - source: pmo_google_client_secret
        target: google_client_secret
        mode: 0444
      - source: pmo_sendgrid_api_key
        target: sendgrid_api_key
        mode: 0444
    networks:
      - promisemodelonline-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-connect.rule=PathPrefix(`/connect/`)"
      - "traefik.http.routers.auth-connect.entrypoints=websecure"
      - "traefik.http.routers.auth-connect.tls=true"
      - "traefik.http.routers.auth-connect.priority=30"
      - "traefik.http.routers.auth-connect.middlewares=ratelimit-token@file,auth-csp@file,security-headers@file"
      - "traefik.http.routers.auth-wellknown.rule=PathPrefix(`/.well-known/`)"
      - "traefik.http.routers.auth-wellknown.entrypoints=websecure"
      - "traefik.http.routers.auth-wellknown.tls=true"
      - "traefik.http.routers.auth-wellknown.priority=30"
      - "traefik.http.routers.auth-wellknown.middlewares=security-headers@file"
      - "traefik.http.routers.auth-account.rule=PathPrefix(`/account/`)"
      - "traefik.http.routers.auth-account.entrypoints=websecure"
      - "traefik.http.routers.auth-account.tls=true"
      - "traefik.http.routers.auth-account.priority=30"
      - "traefik.http.routers.auth-account.middlewares=ratelimit-account@file,auth-csp@file,security-headers@file"
      - "traefik.http.routers.auth-register.rule=PathPrefix(`/account/register`)"
      - "traefik.http.routers.auth-register.entrypoints=websecure"
      - "traefik.http.routers.auth-register.tls=true"
      - "traefik.http.routers.auth-register.priority=40"
      - "traefik.http.routers.auth-register.middlewares=ratelimit-register@file,auth-csp@file,security-headers@file"
      - "traefik.http.routers.auth-external.rule=PathPrefix(`/account/external/`)"
      - "traefik.http.routers.auth-external.entrypoints=websecure"
      - "traefik.http.routers.auth-external.tls=true"
      - "traefik.http.routers.auth-external.priority=40"
      - "traefik.http.routers.auth-external.middlewares=ratelimit-external@file,auth-csp@file,security-headers@file"
      - "traefik.http.routers.auth-signin-google.rule=PathPrefix(`/signin-google`)"
      - "traefik.http.routers.auth-signin-google.entrypoints=websecure"
      - "traefik.http.routers.auth-signin-google.tls=true"
      - "traefik.http.routers.auth-signin-google.priority=30"
      - "traefik.http.services.auth.loadbalancer.server.port=8060"
      - "traefik.http.services.auth.loadbalancer.server.scheme=https"
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8060/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  promisemodelonline.db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD_FILE: /run/secrets/db_sa_password
    secrets:
      - source: pmo_db_sa_password
        target: db_sa_password
        mode: 0444
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - promisemodelonline-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

  promisemodelonline.db-init:
    image: mcr.microsoft.com/mssql-tools
    secrets:
      - source: pmo_auth_db_password
        target: auth_db_password
        mode: 0444
      - source: pmo_api_db_password
        target: api_db_password
        mode: 0444
      - source: pmo_db_sa_password
        target: db_sa_password
        mode: 0444
    environment:
      PMO_API_DB_USER: ${PMO_API_DB_USER}
      PMO_AUTH_DB_USER: ${PMO_AUTH_DB_USER}
    volumes:
      - mssql-data:/var/opt/mssql:rw
    networks:
      - promisemodelonline-net
    configs:
      - source: init_db_script
        target: /init/init-db.sh
        mode: 0555
    entrypoint:
      - /bin/sh
      - -c
      - set -e; tr -d '\r' < /init/init-db.sh > /tmp/init-db.lf && /bin/sh /tmp/init-db.lf
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

   umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      TRACKER_SCRIPT_NAME: script.js
    secrets:
      - source: pmo_umami_db_password
        target: umami_db_password
        mode: 0444
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - promisemodelonline-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami-script.rule=PathPrefix(`/umami/script.js`)"
      - "traefik.http.routers.umami-script.entrypoints=websecure"
      - "traefik.http.routers.umami-script.tls=true"
      - "traefik.http.routers.umami-script.priority=50"
      - "traefik.http.routers.umami-api.rule=PathPrefix(`/umami/api/`)"
      - "traefik.http.routers.umami-api.entrypoints=websecure"
      - "traefik.http.routers.umami-api.tls=true"
      - "traefik.http.routers.umami-api.priority=50"
      - "traefik.http.middlewares.umami-strip-prefix.stripprefix.prefixes=/umami/api"
      - "traefik.http.routers.umami-api.middlewares=umami-strip-prefix"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
    secrets:
      - source: pmo_umami_db_password
        target: umami_db_password
        mode: 0444
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0444
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: 3001
        protocol: tcp
        mode: host
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
        mode: 0444
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
        mode: 0444
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_INSTALL_PLUGINS: ""
    secrets:
      - source: pmo_grafana_admin_password
        target: grafana_admin_password
        mode: 0444
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  umami-init:
    image: postgres:16-alpine
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache apache2-utils > /dev/null 2>&1 &&
      /init/umami-init.sh
      "
    environment:
      WEBSITE_ID: ${UMAMI_WEBSITE_ID:-813ea5c6-8576-44d0-b702-923f5ba331cd}
      WEBSITE_NAME: ${UMAMI_WEBSITE_NAME:-Promise Model Online}
      WEBSITE_DOMAIN: ${UMAMI_WEBSITE_DOMAIN:-localhost}
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
      UMAMI_ADMIN_USERNAME: ${UMAMI_ADMIN_USERNAME}
    secrets:
      - source: pmo_umami_db_password
        target: umami_db_password
        mode: 0444
      - source: pmo_umami_admin_password
        target: umami_admin_password
        mode: 0444
    networks:
      - promisemodelonline-net
    configs:
      - source: umami_init_script
        target: /init/umami-init.sh
        mode: 0555
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

networks:
  promisemodelonline-net:
    driver: overlay
    attachable: true

volumes:
  mssql-data:
    name: mssqldata
    driver: local
  bff-dp-keys:
    name: bffdpkeys
    driver: local
  auth-dp-keys:
    name: authdpkeys
    driver: local
  umami-db:
    name: umamidata
    driver: local
  prometheus-data:
    name: prometheusdata
    driver: local
  grafana-data:
    name: grafanadata
    driver: local

secrets:
  pmo_db_sa_password:
    external: true
  pmo_api_db_password:
    external: true
  pmo_auth_db_password:
    external: true
  pmo_google_client_secret:
    external: true
  pmo_sendgrid_api_key:
    external: true
  pmo_cert_password:
    external: true
  pmo_umami_db_password:
    external: true
  pmo_umami_admin_password:
    external: true
  pmo_cloudflare_tunnel_token:
    external: true
  pmo_auth_registration_key:
    external: true
  pmo_grafana_admin_password:
    external: true

configs:
  traefik_dynamic_ratelimit:
    file: ./traefik/dynamic/middleware-ratelimit.yml
  traefik_dynamic_headers:
    file: ./traefik/dynamic/middleware-headers.yml
  traefik_dynamic_sticky:
    file: ./traefik/dynamic/middleware-sticky.yml
  traefik_dynamic_tls:
    file: ./traefik/dynamic/tls.yml
  prometheus_config:
    file: ./prometheus/prometheus.yml
  grafana_datasource:
    file: ./grafana/datasources/datasource.yml
  grafana_dashboard_provider:
    file: ./grafana/dashboards/dashboard.yml
  init_db_script:
    file: ./scripts/init-db.sh
  umami_init_script:
    file: ./scripts/umami-init.sh
