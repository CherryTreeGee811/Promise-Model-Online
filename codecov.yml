# Codecov configuration for Promise Model Online
codecov:
  require_ci_to_pass: true
  branch: main
  max_report_age: 24

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
        base: auto
    patch:
      default:
        target: 80%
        threshold: 5%

ignore:
  - "**/Migrations/**"
  - "**/Program.cs"
  - "**/*.Designer.cs"
  - "**/obj/**"
  - "**/bin/**"
  - "**/Properties/**"
  - "**/node_modules/**"
  - "**/wwwroot/lib/**"
  - "**/*.g.cs"
  - "**/*.g.i.cs"

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 5%
      - type: patch
        target: 80%

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: true
  hide_project_coverage: false
