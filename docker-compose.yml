services:
  promisemodelonline.client:
    image: ${DOCKER_REGISTRY-}promisemodelonlineclient
    container_name: promisemodelonlineclient
    hostname: localhost
    ports:
      - "9000:9000/tcp"
    depends_on:
      - promisemodelonline.bff
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.Client/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  promisemodelonline.bff:
    image: ${DOCKER_REGISTRY-}promisemodelonlinebff
    container_name: promisemodelonlinebff
    ports:
      - "8010:8010/tcp"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8010
      - AUTH_PUBLIC_ISSUER=https://promisemodelonline.auth:8060
      - AUTH_METADATA_ADDRESS=https://promisemodelonline.auth:8060/.well-known/openid-configuration
      - APP_BASE_URL=https://localhost:9000
      - DATA_PROTECTION_KEYS_PATH=/app/dp-keys
    volumes:
      - bff-dp-keys:/app/dp-keys
    depends_on:
      promisemodelonline.api:
        condition: service_healthy
      promisemodelonline.auth:
        condition: service_healthy
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.BFF/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '1'
          memory: 512M

  promisemodelonline.api:
    image: ${DOCKER_REGISTRY-}promisemodelonlineapi
    container_name: promisemodelonlineapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - JwtSettings__Issuer=https://promisemodelonline.auth:8060
      - JwtSettings__Audience=promisemodelonline.api
      - Auth__RegistrationKey=${AUTH__REG_KEY:-}
      - ConnectionStrings__MSSQL=Server=promisemodelonline.db,1433;Database=PromiseModelOnline;User Id=${PMO_API_DB_USER:-pmo_api};Password_FILE=/run/secrets/api_db_password;TrustServerCertificate=true;
    secrets:
      - api_db_password
    depends_on:
      promisemodelonline.auth:
        condition: service_started
      promisemodelonline.db-init:
        condition: service_completed_successfully
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.Api/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    
  promisemodelonline.auth:
    image: ${DOCKER_REGISTRY-}promisemodelonlineauth
    container_name: promisemodelonlineauth
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8060
      - APP_BASE_URL=https://localhost:9000
      - AUTH_PUBLIC_ISSUER=https://promisemodelonline.auth:8060
      - DATA_PROTECTION_KEYS_PATH=/app/dp-keys
      - ConnectionStrings__MSSQL=Server=promisemodelonline.db,1433;Database=PromiseModelOnlineAuth;User Id=${AUTH_DB_USER:-pmo_auth};Password_FILE=/run/secrets/auth_db_password;TrustServerCertificate=true;
      - Authentication__Google__ClientId=${AUTH_GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret_FILE=/run/secrets/google_client_secret
      - SendGrid__ApiKey_FILE=/run/secrets/sendgrid_api_key
    volumes:
      - auth-dp-keys:/app/dp-keys
    secrets:
      - auth_db_password
      - google_client_secret
      - sendgrid_api_key
    depends_on:
      promisemodelonline.db-init:
        condition: service_completed_successfully
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.Auth/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8060/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  promisemodelonline.db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: promisemodelonlinedb
    networks:
      - promisemodelonline-net
    ports:
      - 1433:1433/tcp
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:-SADevelopment10*}
    volumes:
      - mssql-data:/var/opt/mssql

  promisemodelonline.db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: promisemodelonlinedbinit
    depends_on:
      - promisemodelonline.db
    networks:
      - promisemodelonline-net
    secrets:
      - auth_db_password
      - api_db_password
    environment:
      DB_SA_PASSWORD: ${DB_SA_PASSWORD:-SADevelopment10*}
      PMO_API_DB_USER: ${PMO_API_DB_USER:-pmo_api}
      PMO_AUTH_DB_USER: ${PMO_AUTH_DB_USER:-pmo_auth}
    volumes:
      - ./db/init/run-init.sh:/init/run-init.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - set -e; tr -d '\r' < /init/run-init.sh > /tmp/run-init.lf && /bin/sh /tmp/run-init.lf
    restart: "no"

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    container_name: umami
    ports:
      - "127.0.0.1:3000:3000/tcp"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-4EujhsyrIHdzhNsIoidZHtNM}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      TRACKER_SCRIPT_NAME: script.js
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - promisemodelonline-net
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
    secrets:
      - umami_db_password
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks:
      - promisemodelonline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  umami-init:
    image: postgres:16-alpine
    container_name: umami-init
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache apache2-utils > /dev/null 2>&1 &&
      /init/umami-init.sh
      "
    environment:
      WEBSITE_ID: ${UMAMI_WEBSITE_ID:-813ea5c6-8576-44d0-b702-923f5ba331cd}
      WEBSITE_NAME: ${UMAMI_WEBSITE_NAME:-Promise Model Online}
      WEBSITE_DOMAIN: ${UMAMI_WEBSITE_DOMAIN:-localhost}
      POSTGRES_PASSWORD_FILE: /run/secrets/umami_db_password
      UMAMI_ADMIN_USERNAME: ${UMAMI_ADMIN_USERNAME}
    secrets:
      - umami_db_password
      - umami_admin_password
    volumes:
      - ./scripts/umami-init.sh:/init/umami-init.sh:ro
    depends_on:
      umami:
        condition: service_started
    networks:
      - promisemodelonline-net
    restart: "no"

networks:
  promisemodelonline-net:
    driver: bridge

volumes:
  mssql-data:
    name: mssqldata
    driver: local
  bff-dp-keys:
    name: bffdpkeys
    driver: local
  auth-dp-keys:
    name: authdpkeys
    driver: local
  umami-db:
    name: umamidata
    driver: local

secrets:
  auth_db_password:
    file: ./secrets/auth_db_password.txt
  api_db_password:
    file: ./secrets/api_db_password.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  sendgrid_api_key:
    file: ./secrets/sendgrid_api_key.txt
  umami_db_password:
    file: ./secrets/umami_db_password.txt
  umami_admin_password:
    file: ./secrets/umami_admin_password.txt
