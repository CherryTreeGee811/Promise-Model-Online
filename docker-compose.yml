services:
  promisemodelonline.client:
    image: ${DOCKER_REGISTRY-}promisemodelonlineclient
    container_name: promisemodelonlineclient
    hostname: localhost
    ports:
      - "9000:9000/tcp"
    depends_on:
      - promisemodelonline.bff
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.Client/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  promisemodelonline.bff:
    image: ${DOCKER_REGISTRY-}promisemodelonlinebff
    container_name: promisemodelonlinebff
    ports:
      - "8010:8010/tcp"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8010
      - AUTH_PUBLIC_ISSUER=https://promisemodelonline.auth:8060
      - AUTH_METADATA_ADDRESS=https://promisemodelonline.auth:8060/.well-known/openid-configuration
      - APP_BASE_URL=https://localhost:9000
    depends_on:
      promisemodelonline.api:
        condition: service_healthy
      promisemodelonline.auth:
        condition: service_healthy
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.BFF/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  promisemodelonline.api:
    image: ${DOCKER_REGISTRY-}promisemodelonlineapi
    container_name: promisemodelonlineapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      - JwtSettings__Issuer=https://promisemodelonline.auth:8060
      - JwtSettings__Audience=promisemodelonline.api
      - Auth__RegistrationKey=${AUTH__REG_KEY:-}
      - ConnectionStrings__MSSQL=Server=promisemodelonline.db,1433;Database=PromiseModelOnline;User Id=${PMO_API_DB_USER:-pmo_api};Password_FILE=/run/secrets/api_db_password;TrustServerCertificate=true;
    secrets:
      - api_db_password
    depends_on:
      promisemodelonline.auth:
        condition: service_started
      promisemodelonline.db-init:
        condition: service_completed_successfully
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.Api/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    
  promisemodelonline.auth:
    image: ${DOCKER_REGISTRY-}promisemodelonlineauth
    container_name: promisemodelonlineauth
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8060
      - APP_BASE_URL=https://localhost:9000
      - AUTH_PUBLIC_ISSUER=https://promisemodelonline.auth:8060
      - ConnectionStrings__MSSQL=Server=promisemodelonline.db,1433;Database=PromiseModelOnlineAuth;User Id=${AUTH_DB_USER:-pmo_auth};Password_FILE=/run/secrets/auth_db_password;TrustServerCertificate=true;
      - Authentication__Google__ClientId=${AUTH_GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret_FILE=/run/secrets/google_client_secret
    secrets:
      - auth_db_password
      - google_client_secret
    depends_on:
      promisemodelonline.db-init:
        condition: service_completed_successfully
    networks:
      - promisemodelonline-net
    build:
      context: .
      dockerfile: PromiseModelOnline.Auth/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8060/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  promisemodelonline.db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: promisemodelonlinedb
    networks:
      - promisemodelonline-net
    ports:
      - 1433:1433/tcp
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:-SADevelopment10*}
    volumes:
      - mssql-data:/var/opt/mssql

  promisemodelonline.db-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: promisemodelonlinedbinit
    depends_on:
      - promisemodelonline.db
    networks:
      - promisemodelonline-net
    secrets:
      - auth_db_password
      - api_db_password
    environment:
      DB_SA_PASSWORD: ${DB_SA_PASSWORD:-SADevelopment10*}
      PMO_API_DB_USER: ${PMO_API_DB_USER:-pmo_api}
      PMO_AUTH_DB_USER: ${PMO_AUTH_DB_USER:-pmo_auth}
    volumes:
      - ./db/init/run-init.sh:/init/run-init.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - set -e; tr -d '\r' < /init/run-init.sh > /tmp/run-init.lf && /bin/sh /tmp/run-init.lf
    restart: "no"

networks:
  promisemodelonline-net:
    driver: bridge

volumes:
  mssql-data:
    name: mssqldata
    driver: local

secrets:
  auth_db_password:
    file: ./secrets/auth_db_password.txt
  api_db_password:
    file: ./secrets/api_db_password.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
