      - name: Add Client CI TLS/SSL CERT & KEY
        shell: bash
        run: |
          mkdir -p PromiseModelOnline.Client
          cat > PromiseModelOnline.Client/cert.pem <<'PEM'
          ${{ vars.CLIENT_CI_CERT }}
          PEM
          cat > PromiseModelOnline.Client/key.pem <<'PEM'
          ${{ secrets.CLIENT_CI_KEY }}
          PEM
      
      - name: Add GATEWAY CI TLS/SSL CERT & KEY
        shell: bash
        run: |
          mkdir -p PromiseModelOnline.BFF
          cat > PromiseModelOnline.BFF/cert.pem <<'PEM'
          ${{ vars.BFF_CI_CERT }}
          PEM
          cat > PromiseModelOnline.BFF/key.pem <<'PEM'
          ${{ secrets.BFF_CI_KEY }}
          PEM

      - name: Add AUTH CI TLS/SSL CERT & KEY
        shell: bash
        run: |
          mkdir -p PromiseModelOnline.Auth
          cat > PromiseModelOnline.Auth/cert.pem <<'PEM'
          ${{ vars.AUTH_CI_CERT }}
          PEM
          cat > PromiseModelOnline.Auth/key.pem <<'PEM'
          ${{ secrets.AUTH_CI_KEY }}
          PEM

      - name: Write secrets from GitHub Secrets
        shell: bash
        run: |
            mkdir -p secrets
            printf '%s' "${{ secrets.PMO_AUTH_DB_PASSWORD }}" > secrets/auth_db_password.txt
            printf '%s' "${{ secrets.PMO_API_DB_PASSWORD }}" > secrets/api_db_password.txt
            printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRET }}" > secrets/google_client_secret.txt
            printf '%s' "${{ secrets.SENDGRID_API_KEY }}" > secrets/sendgrid_api_key.txt
            printf '%s' "${{ secrets.UMAMI_ADMIN_PASSWORD }}" > secrets/umami_admin_password.txt
            printf '%s' "${{ secrets.UMAMI_DB_PASSWORD }}" > secrets/umami_db_password.txt

