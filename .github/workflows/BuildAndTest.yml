name: PromiseModelOnline
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
jobs:
  BuildAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
                
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # ─── 1. Build all projects (fail fast on compilation errors) ───

      - name: Restore & Build All Projects
        shell: bash
        run: dotnet build

      - name: Add Client CI TLS/SSL CERT & KEY
        shell: bash
        run: |
          mkdir -p PromiseModelOnline.Client
          cat > PromiseModelOnline.Client/cert.pem <<'PEM'
          ${{ vars.CLIENT_CI_CERT }}
          PEM
          cat > PromiseModelOnline.Client/key.pem <<'PEM'
          ${{ secrets.CLIENT_CI_KEY }}
          PEM
      
      - name: Add GATEWAY CI TLS/SSL CERT & KEY
        shell: bash
        run: |
          mkdir -p PromiseModelOnline.BFF
          cat > PromiseModelOnline.BFF/cert.pem <<'PEM'
          ${{ vars.BFF_CI_CERT }}
          PEM
          cat > PromiseModelOnline.BFF/key.pem <<'PEM'
          ${{ secrets.BFF_CI_KEY }}
          PEM

      - name: Add AUTH CI TLS/SSL CERT & KEY
        shell: bash
        run: |
          mkdir -p PromiseModelOnline.Auth
          cat > PromiseModelOnline.Auth/cert.pem <<'PEM'
          ${{ vars.AUTH_CI_CERT }}
          PEM
          cat > PromiseModelOnline.Auth/key.pem <<'PEM'
          ${{ secrets.AUTH_CI_KEY }}
          PEM

      - name: Write secrets from GitHub Secrets
        shell: bash
        run: |
            mkdir -p secrets
            printf '%s' "${{ secrets.PMO_AUTH_DB_PASSWORD }}" > secrets/auth_db_password.txt
            printf '%s' "${{ secrets.PMO_API_DB_PASSWORD }}" > secrets/api_db_password.txt
            printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRET }}" > secrets/google_client_secret.txt
            printf '%s' "${{ secrets.SENDGRID_API_KEY }}" > secrets/sendgrid_api_key.txt

      # ─── 2. Unit tests (no infrastructure needed) ───

      - name: Run BFF Tests
        shell: bash
        run: |
          mkdir -p BffTestResults
          dotnet test ./PromiseModelOnline.BFF.Tests/PromiseModelOnline.BFF.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./BffTestResults \
            --os linux \
            --logger "console;verbosity=normal"

      - name: Run Auth Unit Tests
        shell: bash
        run: |
          mkdir -p AuthTestResults
          dotnet test ./PromiseModelOnline.Auth.Tests/PromiseModelOnline.Auth.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./AuthTestResults \
            --os linux \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName!~IntegrationTests"

      - name: Run API Tests
        shell: bash
        run: |
          mkdir -p ApiTestResults
          dotnet test ./PromiseModelOnline.Api.Tests/PromiseModelOnline.Api.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ApiTestResults \
            --os linux \
            --logger "console;verbosity=normal"

      # ─── 3. Integration tests (in-memory, no Docker) ───

      - name: Run Auth Integration Tests
        shell: bash
        run: |
          dotnet test ./PromiseModelOnline.Auth.Tests/PromiseModelOnline.Auth.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./AuthTestResults \
            --os linux \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~IntegrationTests"

      # ─── 4. Client/UI tests (WireMock Docker, lightweight) ───

      - name: Run Client UI Test Environment
        shell: bash
        run: docker compose --project-name promisemodelonline-ui-test -f infrastructure/tests/docker-compose.ui.yml up -d

      - name: Smoke Test Client UI Test Environment
        shell: bash
        run: |
          echo "Waiting for WireMock..."
          WIREMOCK_READY=false
          for i in $(seq 1 10); do
            STATUS=$(docker exec promisemodelonlinebffmock curl -k -s -o /dev/null -w "%{http_code}" https://localhost:8010/health || true)
            if [ "$STATUS" -eq 200 ]; then
              BODY=$(docker exec promisemodelonlinebffmock curl -k -s https://localhost:8010/health)
              if echo "$BODY" | grep -q '"healthy"'; then
                echo "WireMock is healthy"
                WIREMOCK_READY=true
                break
              fi
            fi
            echo "WireMock not ready (attempt $i)..."
            sleep 2
          done
          if [ "$WIREMOCK_READY" = false ]; then
            echo "ERROR: WireMock failed to become healthy within 20 seconds"
            exit 1
          fi

          echo "Waiting for Client (Nginx)..."
          CLIENT_READY=false
          for i in $(seq 1 10); do
            STATUS=$(docker exec promisemodelonlineclient curl -k -s -o /dev/null -w "%{http_code}" https://localhost:9000/health || true)
            if [ "$STATUS" -eq 200 ]; then
              BODY=$(docker exec promisemodelonlineclient curl -k -s https://localhost:9000/health)
              if echo "$BODY" | grep -q '"healthy"'; then
                echo "Client is healthy"
                CLIENT_READY=true
                break
              fi
            fi
            echo "Client not ready (attempt $i)..."
            sleep 2
          done
          if [ "$CLIENT_READY" = false ]; then
            echo "ERROR: Client failed to become healthy within 20 seconds"
            exit 1
          fi
          
      - name: Run Client Tests
        shell: bash
        run: |
          mkdir -p ClientTestResults
          dotnet test ./PromiseModelOnline.Client.Tests/PromiseModelOnline.Client.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ClientTestResults \
            --os linux \
            --logger "console;verbosity=normal"

      - name: Teardown Client UI Test Environment
        if: always()
        shell: bash
        run: docker compose --project-name promisemodelonline-ui-test -f infrastructure/tests/docker-compose.ui.yml down --remove-orphans -v

      # ─── 5. E2E tests (full Docker stack with SQL Server, slowest) ───

      - name: Start Stack & Wait for Health
        shell: bash
        run: |
          export DB_SA_PASSWORD="${{ secrets.DB_SA_PASSWORD }}"
          export JWT__KEY="${{ secrets.JWT__KEY }}"
          export AUTH__REG_KEY="${{ secrets.AUTH__REG_KEY }}"

          docker compose --project-name promisemodelonline up -d

          for i in $(seq 1 40); do
            HEALTHY=$(docker inspect \
              promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient \
              --format '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$(echo "$HEALTHY" | grep -c 'healthy')" -eq 4 ]; then
              echo "All services healthy"
              exit 0
            fi
            EXITED=$(docker inspect \
              promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient \
              --format '{{.State.Status}}' 2>/dev/null | grep 'exited' || true)
            if [ -n "$EXITED" ]; then
              echo "ERROR: A service exited during startup"
              for svc in promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient; do
                docker logs "$svc" --tail 60 2>&1
              done
              exit 1
            fi
            sleep 5
          done

          echo "ERROR: Timed out waiting for services"
          for svc in promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient; do
            echo "--- $svc ---"
            docker logs "$svc" --tail 60 2>&1
          done
          exit 1

      - name: Run E2E Tests (full stack through nginx)
        shell: bash
        run: |
          mkdir -p E2eTestResults
          pwsh ./PromiseModelOnline.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
          dotnet test ./PromiseModelOnline.E2E.Tests/PromiseModelOnline.E2E.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./E2eTestResults \
            --os linux \
            --logger "console;verbosity=normal"

      - name: Tear Down Production Services
        if: always()
        shell: bash
        run: docker compose --project-name promisemodelonline down -v

      - name: Push Docker Images to DockerHub
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          docker tag promisemodelonlineapi cherrytree811/promisemodelonlineapi:latest
          docker tag promisemodelonlineclient cherrytree811/promisemodelonlineclient:latest
          docker tag promisemodelonlineauth cherrytree811/promisemodelonlineauth:latest
          docker tag promisemodelonlinebff cherrytree811/promisemodelonlinebff:latest
          docker login -u cherrytree811 -p ${{ secrets.DOCKER_CRED }}
          docker push cherrytree811/promisemodelonlineapi:latest
          docker push cherrytree811/promisemodelonlineclient:latest
          docker push cherrytree811/promisemodelonlineauth:latest
          docker push cherrytree811/promisemodelonlinebff:latest
