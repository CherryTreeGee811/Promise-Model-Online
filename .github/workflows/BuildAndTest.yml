name: PromiseModelOnline
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
jobs:
  BuildAndTest:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Clean up stale containers (act local runs)
        if: env.ACT == 'true'
        shell: bash
        run: |
          if command -v docker &>/dev/null; then
            docker rm -f $(docker ps -aq --filter name=promisemodelonline) 2>/dev/null || true
            docker network prune -f 2>/dev/null || true
          fi

      - name: Check for accidentally committed large files
        shell: bash
        run: |
          LARGE=$(find . -not -path './node_modules/*' -not -path './.git/*' -size +10M -type f)
          if [ -n "$LARGE" ]; then
            echo "ERROR: Files >10MB detected (likely accidental commit):"
            echo "$LARGE"
            exit 1
          fi

      - name: Check __Host-pmo.session only (no pmo.session in production)
        shell: bash
        run: |
          MATCHES=$(grep -rn 'pmo\.session' PromiseModelOnline.Api/ PromiseModelOnline.Auth/ PromiseModelOnline.BFF/ PromiseModelOnline.Client/ 2>/dev/null | grep -v '\.Tests/' | grep -v node_modules | grep -v '__Host-pmo\.session' || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: pmo.session cookie found in production source. Use __Host-pmo.session only."
            echo "$MATCHES"
            exit 1
          fi

      - name: Check __Host-pmo.auth only (no pmo.auth in production)
        shell: bash
        run: |
          MATCHES=$(grep -rn 'pmo\.auth' PromiseModelOnline.Api/ PromiseModelOnline.Auth/ PromiseModelOnline.BFF/ PromiseModelOnline.Client/ 2>/dev/null | grep -v '\.Tests/' | grep -v node_modules | grep -v '__Host-pmo\.auth' | grep -vE '\.(ts|js):' || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: pmo.auth cookie found in production source. Use __Host-pmo.auth only."
            echo "$MATCHES"
            exit 1
          fi
                
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v5
        id: npm-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install PowerShell (act and self-hosted runners)
        if: env.ACT == 'true' || contains(runner.labels, 'self-hosted')
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq powershell

      - name: Restore & Build All Projects
        shell: bash
        run: dotnet build Promise-Model-Online.sln

      - name: Enforce .NET code style (dotnet format)
        shell: bash
        run: dotnet format Promise-Model-Online.sln --verify-no-changes

      - name: Check .NET packages for known vulnerabilities
        shell: bash
        run: |
          for proj in PromiseModelOnline.Api PromiseModelOnline.Api.Tests PromiseModelOnline.Auth PromiseModelOnline.Auth.Tests PromiseModelOnline.BFF; do
            dotnet list "$proj/$proj.csproj" package --vulnerable
          done

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Production dependency audit
        shell: bash
        run: |
          echo "=== Production dependency tree ==="
          npm ls --omit=dev --depth=0
          echo ""
          echo "=== Production dependency vulnerability scan ==="
          npm audit --omit=dev --audit-level=low

      - name: Full dependency audit (production + dev)
        shell: bash
        run: npm audit --audit-level=low

      - name: Production dependency boundary check (Layer 1)
        shell: bash
        run: bash scripts/check-prod-deps.sh

      - name: ESLint & Quality (client JS/CSS/HTML)
        shell: bash
        run: |
          npm run lint
          npm run lint:html
          npm run lint:css
          npm run lint:nginx
          npm run typecheck
          npm run lint:dry
          npm run lint:dead
          npm run test -- --coverage --coverage.thresholds.lines=70 --coverage.thresholds.branches=70 --coverage.thresholds.functions=70 --coverage.thresholds.statements=70 2>&1 | tee /tmp/vitest-coverage.log; if grep -q "ERROR: Coverage for" /tmp/vitest-coverage.log; then echo "Coverage thresholds not met!"; grep "ERROR: Coverage for" /tmp/vitest-coverage.log; exit 1; fi
          npm run build

      - name: Validate deploy/ configs
        shell: bash
        run: |
          set -e

          echo "=== Docker Compose/Stack YAML ==="
          export DB_SA_PASSWORD=ci-dummy
          export UMAMI_DB_PASSWORD=ci-dummy
          docker compose -f deploy/docker-compose.yml config -q
          echo "  ✅ deploy/docker-compose.yml"
          docker compose -f deploy/docker-stack.yml config -q
          echo "  ✅ deploy/docker-stack.yml"

          echo ""
          echo "=== Shell scripts ==="
          docker run --rm -v "$(pwd):/mnt" koalaman/shellcheck:stable \
            deploy/deploy.sh \
            deploy/scripts/generate-secrets.sh \
            deploy/scripts/init-db.sh \
            deploy/scripts/umami-init.sh
          echo "  ✅ All shell scripts"

          echo ""
          echo "=== Ansible (playbooks, inventory, vars) ==="
          docker run --rm -v "$(pwd):/work" --workdir /work \
            python:3.12-slim bash -c "
              apt-get update -qq && apt-get install -y -qq rsync >/dev/null
              pip install -q ansible-lint
              ansible-lint deploy/ansible/
            "
          echo "  ✅ All Ansible YAML"

      - name: Source code import boundary (Layer 2)
        shell: bash
        run: bash scripts/check-source-imports.sh

      - name: Bundle boundary audit (Layer 3)
        shell: bash
        run: bash scripts/check-bundle.sh

      - name: Generate dev certs for volume mounts
        shell: bash
        run: bash scripts/generate-dev-certs.sh

      - name: Write secrets from GitHub Secrets
        shell: bash
        run: |
            mkdir -p secrets
            printf '%s' "${{ secrets.PMO_AUTH_DB_PASSWORD }}" > secrets/auth_db_password.txt
            printf '%s' "${{ secrets.PMO_API_DB_PASSWORD }}" > secrets/api_db_password.txt
            printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRET }}" > secrets/google_client_secret.txt
            printf '%s' "${{ secrets.SENDGRID_API_KEY }}" > secrets/sendgrid_api_key.txt
            printf '%s' "${{ secrets.UMAMI_ADMIN_PASSWORD }}" > secrets/umami_admin_password.txt
            printf '%s' "${{ secrets.UMAMI_DB_PASSWORD }}" > secrets/umami_db_password.txt
            printf '%s' "${{ secrets.CERT_PASSWORD }}" > secrets/cert_password.txt
            printf '%s' "${{ secrets.DB_SA_PASSWORD }}" > secrets/db_sa_password.txt
            printf '%s' "${{ secrets.AUTH__REG_KEY }}" > secrets/auth_registration_key.txt
            printf '%s' "${{ secrets.GITHUB_ISSUE_TOKEN }}" > secrets/github_token.txt

      - name: Run Auth Unit Tests
        shell: bash
        run: |
          mkdir -p AuthTestResults
          dotnet test ./PromiseModelOnline.Auth.Tests/PromiseModelOnline.Auth.Tests.csproj \
            --no-build \
            --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./AuthTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName!~IntegrationTests"
          bash scripts/check-coverage.sh ./AuthTestResults 0.70 0.70 0.70

      - name: Run API Unit Tests
        shell: bash
        run: |
          mkdir -p ApiUnitTestResults
          dotnet test ./PromiseModelOnline.Api.Tests/PromiseModelOnline.Api.Tests.csproj \
            --no-build \
            --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ApiUnitTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName!~IntegrationTests"
          bash scripts/check-coverage.sh ./ApiUnitTestResults 0.70 0.70 0.70

      - name: Run Auth Integration Tests
        shell: bash
        run: |
          mkdir -p AuthTestResults
          dotnet test ./PromiseModelOnline.Auth.Tests/PromiseModelOnline.Auth.Tests.csproj \
            --no-build \
            --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./AuthTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~IntegrationTests"
          bash scripts/check-coverage.sh ./AuthTestResults 0.30

      - name: Run BFF Integration Tests
        shell: bash
        run: |
          mkdir -p BffTestResults
          dotnet test ./PromiseModelOnline.BFF.Tests/PromiseModelOnline.BFF.Tests.csproj \
            --no-build \
            --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./BffTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~IntegrationTests"
          bash scripts/check-coverage.sh ./BffTestResults 0.30

      - name: Run API Integration Tests
        shell: bash
        run: |
          mkdir -p ApiIntegrationTestResults
          dotnet test ./PromiseModelOnline.Api.Tests/PromiseModelOnline.Api.Tests.csproj \
            --no-build \
            --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ApiIntegrationTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~IntegrationTests"
          bash scripts/check-coverage.sh ./ApiIntegrationTestResults 0.30

      - name: Run Client UI Test Environment
        shell: bash
        run: docker compose --project-name promisemodelonline-ui-test -f infrastructure/tests/docker-compose.ui.yml up -d --build

      - name: Wait for Client (Nginx)
        shell: bash
        run: |
          for i in $(seq 1 15); do
            STATUS=$(docker exec promisemodelonlineclient sh -c "test -f /tmp/nginx.pid && echo 200 || echo 000" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then echo "Client healthy"; exit 0; fi
            sleep 2
          done
          echo "ERROR: Client not healthy within 30s"
          docker logs promisemodelonlineclient --tail 30 2>&1
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/PromiseModelOnline.Client.Tests.csproj', 'package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache Puppeteer browsers
        id: puppeteer-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pwsh ./PromiseModelOnline.Client.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
          pwsh ./PromiseModelOnline.Client.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps firefox
          pwsh ./PromiseModelOnline.Client.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps webkit
          npx playwright-core install --with-deps chromium

      - name: Install system deps (cache hit — browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          pwsh ./PromiseModelOnline.Client.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium 2>&1 | tail -3
          pwsh ./PromiseModelOnline.Client.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps firefox  2>&1 | tail -3
          pwsh ./PromiseModelOnline.Client.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps webkit   2>&1 | tail -3
          npx playwright-core install --with-deps chromium 2>&1 | tail -3

      - name: Install Puppeteer Chrome (cache miss)
        if: steps.puppeteer-cache.outputs.cache-hit != 'true'
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
        shell: bash
        run: npx @puppeteer/browsers install chrome

      - name: Install Puppeteer Chrome system deps (cache hit)
        if: steps.puppeteer-cache.outputs.cache-hit == 'true'
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
        shell: bash
        run: npx @puppeteer/browsers install chrome 2>&1 | tail -3

      - name: Run Client Tests (Chromium)
        shell: bash
        env:
          TEST_BROWSER: chromium
        run: |
          dotnet test ./PromiseModelOnline.Client.Tests/PromiseModelOnline.Client.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ClientTestResults \
            --logger "console;verbosity=normal"

      - name: Run Client Tests (Firefox)
        shell: bash
        env:
          TEST_BROWSER: firefox
        run: |
          dotnet test ./PromiseModelOnline.Client.Tests/PromiseModelOnline.Client.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ClientTestResults \
            --logger "console;verbosity=normal"

      - name: Run Client Tests (WebKit)
        shell: bash
        env:
          TEST_BROWSER: webkit
        run: |
          dotnet test ./PromiseModelOnline.Client.Tests/PromiseModelOnline.Client.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./ClientTestResults \
            --logger "console;verbosity=normal"

      - name: A11y + Responsive + Lighthouse Audit
        shell: bash
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
        run: |
          CHROME=$(ls ~/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome 2>/dev/null | head -1)
          if [ -n "$CHROME" ]; then export CHROME_PATH="$CHROME"; fi
          npm run lint:a11y https://localhost:9000
          npm run lint:responsive https://localhost:9000
          npm run lint:lighthouse

      - name: Memory Leak Audit (single-run)
        shell: bash
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
        run: |
          URL=https://localhost:9000 npx memlab run \
            --scenario scripts/memlab-scenarios/leak-check.cjs \
            --chromium-binary "$(ls ~/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome 2>/dev/null | head -1)"

      - name: Memory Leak Audit (iterative)
        shell: bash
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
        run: |
          URL=https://localhost:9000 node scripts/check-memory-leaks-iterative.cjs \
            --chromium-binary "$(ls ~/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome 2>/dev/null | head -1)"

      - name: Teardown Client UI Test Environment
        if: always()
        shell: bash
        run: docker compose --project-name promisemodelonline-ui-test -f infrastructure/tests/docker-compose.ui.yml down -v

      - name: Start E2E Stack (without rate limiting)
        shell: bash
        run: |
          docker compose --project-name promisemodelonline \
            -f docker-compose.yml \
            -f infrastructure/tests/docker-compose.e2e-override.yml \
            up -d

          for i in $(seq 1 40); do
            HEALTHY=$(docker inspect \
              promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient \
              --format '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$(echo "$HEALTHY" | grep -c 'healthy')" -eq 4 ]; then
              echo "All services healthy"
              exit 0
            fi
            EXITED=$(docker inspect \
              promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient \
              --format '{{.State.Status}}' 2>/dev/null | grep 'exited' || true)
            if [ -n "$EXITED" ]; then
              echo "ERROR: A service exited during startup"
              for svc in promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient; do
                docker logs "$svc" --tail 60 2>&1
              done
              exit 1
            fi
            sleep 5
          done

          echo "ERROR: Timed out waiting for services"
          for svc in promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient; do
            echo "--- $svc ---"
            docker logs "$svc" --tail 60 2>&1
          done
          exit 1

      - name: Run E2E Tests — Core (no rate-limiting)
        shell: bash
        run: |
          export PMO_ENABLE_RATE_LIMITING_TESTS=false
          mkdir -p E2eTestResults
          dotnet test ./PromiseModelOnline.E2E.Tests/PromiseModelOnline.E2E.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./E2eTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName!~RateLimitingTests"

      - name: Database query performance verification
        shell: bash
        run: |
          PMO_API_DB_PASSWORD="${{ secrets.PMO_API_DB_PASSWORD }}" \
            bash scripts/check-query-performance.sh

      - name: Security — OWASP ZAP DAST scan
        if: env.ACT != 'true'
        shell: bash
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/zap-output:/zap/wrk:rw \
            -v ${{ github.workspace }}/infrastructure/tests/zap-baseline.conf:/zap/wrk-config/zap-baseline.conf:ro \
            -e JAVA_OPTS="-Xmx2048m" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t https://localhost:9000 \
            -r /zap/wrk/zap-report.html \
            -c /zap/wrk-config/zap-baseline.conf \
            -P 8079 \
            -z "-config globalexcludeurl.url= -config hsqldb.writeDelayMs=5000 -config database.recovery.log=false"

      - name: Tear Down E2E Stack
        shell: bash
        run: docker compose --project-name promisemodelonline down -v

      - name: Start E2E Stack for Rate-Limit Tests
        shell: bash
        run: |
          docker compose --project-name promisemodelonline up -d

          for i in $(seq 1 40); do
            HEALTHY=$(docker inspect \
              promisemodelonlineapi promisemodelonlineauth promisemodelonlinebff promisemodelonlineclient \
              --format '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$(echo "$HEALTHY" | grep -c 'healthy')" -eq 4 ]; then
              echo "All services healthy"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Timed out waiting for services"
          exit 1

      - name: Wait for port (host side)
        shell: bash
        run: |
          for i in $(seq 1 15); do
            STATUS=$(docker exec promisemodelonlineclient sh -c "test -f /tmp/nginx.pid && echo 200 || echo 000" 2>/dev/null || true)
            if [ "$STATUS" = "200" ]; then echo "Port 9000 ready"; exit 0; fi
            sleep 2
          done
          echo "ERROR: Port 9000 not accessible from host"
          exit 1

      - name: Install Playwright browsers for E2E tests
        shell: bash
        run: |
          pwsh ./PromiseModelOnline.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium 2>&1

      - name: Run E2E Tests — Rate Limiting only
        shell: bash
        run: |
          export PMO_ENABLE_RATE_LIMITING_TESTS=true
          dotnet test ./PromiseModelOnline.E2E.Tests/PromiseModelOnline.E2E.Tests.csproj \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./E2eTestResults \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~RateLimitingTests"

      - name: Tear Down E2E Stack (Rate-Limit)
        shell: bash
        run: docker compose --project-name promisemodelonline down -v

      - name: Upload .NET coverage to Codecov
        if: env.ACT != 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: dotnet
          files: |
            ./AuthTestResults/*/coverage.cobertura.xml
            ./ApiUnitTestResults/*/coverage.cobertura.xml
            ./ApiIntegrationTestResults/*/coverage.cobertura.xml
            ./BffTestResults/*/coverage.cobertura.xml
            ./ClientTestResults/*/coverage.cobertura.xml
            ./E2eTestResults/*/coverage.cobertura.xml

      - name: Upload TS coverage to Codecov
        if: env.ACT != 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: typescript
          files: ./coverage/clover.xml

      - name: Hadolint (all Dockerfiles)
        shell: bash
        run: |
          errors=0
          for dockerfile in */Dockerfile; do
            echo "=== Linting $dockerfile ==="
            docker run --rm -i ghcr.io/hadolint/hadolint < "$dockerfile" || errors=$((errors + 1))
          done
          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors Dockerfile(s) failed linting"
            exit 1
          fi

      - name: Run Trivy (Dockerfiles + .csproj config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          skip-dirs: "node_modules"

      - name: Scan Docker images
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlineapi"
          format: "sarif"
          output: "trivy-image-api.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Scan Docker image (client)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlineclient"
          format: "sarif"
          output: "trivy-image-client.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Scan Docker image (auth)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlineauth"
          format: "sarif"
          output: "trivy-image-auth.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Scan Docker image (bff)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlinebff"
          format: "sarif"
          output: "trivy-image-bff.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy filesystem results
        if: env.ACT != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-fs"

      - name: Upload Trivy image scan results (API)
        if: env.ACT != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-api.sarif"
          category: "trivy-image-api"

      - name: Upload Trivy image scan results (client)
        if: env.ACT != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-client.sarif"
          category: "trivy-image-client"

      - name: Upload Trivy image scan results (auth)
        if: env.ACT != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-auth.sarif"
          category: "trivy-image-auth"

      - name: Upload Trivy image scan results (bff)
        if: env.ACT != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-image-bff.sarif"
          category: "trivy-image-bff"

      - name: Generate SBOM (source — .csproj + package.json)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "cyclonedx"
          output: "sbom-source.cdx.json"
          exit-code: "0"
          skip-dirs: "node_modules"

      - name: Generate SBOM (API container — includes OS packages)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlineapi"
          format: "cyclonedx"
          output: "sbom-api.cdx.json"
          exit-code: "0"

      - name: Generate SBOM (Client container — includes OS packages)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlineclient"
          format: "cyclonedx"
          output: "sbom-client.cdx.json"
          exit-code: "0"

      - name: Generate SBOM (Auth container — includes OS packages)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlineauth"
          format: "cyclonedx"
          output: "sbom-auth.cdx.json"
          exit-code: "0"

      - name: Generate SBOM (BFF container — includes OS packages)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "promisemodelonlinebff"
          format: "cyclonedx"
          output: "sbom-bff.cdx.json"
          exit-code: "0"

      - name: Upload SBOMs
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-source.cdx.json
            sbom-api.cdx.json
            sbom-client.cdx.json
            sbom-auth.cdx.json
            sbom-bff.cdx.json
            /tmp/testssl-report.html
            /tmp/zap-report.html

      - name: Push Docker Images to DockerHub
        if: github.ref == 'refs/heads/main' && env.ACT != 'true'
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker login -u cherrytree811 -p ${{ secrets.DOCKER_CRED }}
          for SERVICE in api client auth bff proxy; do
            IMG="cherrytree811/promisemodelonline${SERVICE}"
            docker tag "promisemodelonline${SERVICE}" "${IMG}:latest"
            docker tag "promisemodelonline${SERVICE}" "${IMG}:${SHA}"
            docker push "${IMG}:latest"
            docker push "${IMG}:${SHA}"
          done
