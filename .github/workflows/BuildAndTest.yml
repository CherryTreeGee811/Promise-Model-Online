      - name: Security — OWASP ZAP DAST scan
        shell: bash
        run: |
          docker run --rm \
            --network host \
            -v /tmp:/zap/wrk:rw \
            -v ${{ github.workspace }}/infrastructure/tests/zap-baseline.conf:/zap/wrk/zap-baseline.conf:ro \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t https://localhost:9000 \
            -r /zap/wrk/zap-report.html \
            -c /zap/wrk/zap-baseline.conf \
            -p 8079 \
            -z "-config globalexcludeurl.url="

      - name: Tear Down E2E Stack
        shell: bash
        run: docker compose --project-name promisemodelonline down -v

